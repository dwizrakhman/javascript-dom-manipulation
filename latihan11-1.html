<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    #output {
        border: 2px solid black;
        padding: 10px;
        margin-top: 15px ;
        width: 250px;
    }
    </style>
</head>
<body>
    <h2>Kalkulator Sederhana</h2>
    <input type="number" id="angka1"> 
    <input type="number" id="angka2">
    <br><br>
    <button id="btn-ubah-text">Penambahan</button>
    <button id="btn-kurang">Pengurang</button>
    <button id="btn-kali">Perkalikan</button>
    <button id="btn-bagi">Pembagian</button>
    <div id="output">Hasil:</div>

    <script>
        let angka1 = document.getElementById("angka1");
        let angka2 = document.getElementById("angka2");
        let output = document.getElementById("output");

        document.getElementById("btn-ubah-text").onclick = function() {

            let angka1 = Number(document.getElementById("angka1").value);
            let angka2 = Number(document.getElementById("angka2").value);

            let hasil = angka1 + angka2;

            document.getElementById("output").innerHTML = "hasil: " + hasil;

        };

        document.getElementById("btn-kurang").onclick = function()  {
            let angka1 = Number(document.getElementById("angka1").value);
            let angka2 = Number(document.getElementById("angka2").value);

            let hasil = angka1 - angka2;

            document.getElementById("output").innerHTML = "hasil:" + hasil;
        };

        document.getElementById("btn-kali").onclick = function()  {
            let angka1 = Number(document.getElementById("angka1").value);
            let angka2 = Number(document.getElementById("angka2").value);

            let hasil = angka1 * angka2;

            document.getElementById("output").innerHTML = "hasil:" + hasil;
        };

        document.getElementById("btn-bagi").onclick = function()  {
            let angka1 = Number(document.getElementById("angka1").value);
            let angka2 = Number(document.getElementById("angka2").value);
            
            if (angka2 == 0) {
                document.getElementById("output").innerHTML =
                "Error: Tidak bisa dibagi nol!";
            } else {
                let hasil = angka1 / angka2;
                
                 document.getElementById("output").innerHTML = "hasil:" + hasil;
            }
        };
    </script>
</body>
</html>
