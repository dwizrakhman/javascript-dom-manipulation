<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latihan 11-3 — Light/Dark Mode Toggle</title>
  <style>
    /* Warna tema terang (default) */
    :root {
      --bg: #f6f7fb;
      --text: #1f2430;
      --card: #ffffff;
      --border: #d9dde7;
      --accent: #2f5bea;
    }

    /* Warna tema gelap: aktif saat <body> punya class "dark" */
    body.dark {
      --bg: #14171f;
      --text: #e8eaf0;
      --card: #1e222d;
      --border: #333949;
      --accent: #8fb0ff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    main {
      width: min(90%, 460px);
      padding: 2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: background 0.3s, border-color 0.3s;
    }

    h1 { margin-top: 0; font-size: 1.5rem; }
    p  { line-height: 1.6; }

    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 8px;
    }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Light/Dark Mode</h1>
    <p>Klik tombol di bawah untuk berganti tema. Pilihanmu disimpan, jadi tetap sama saat halaman dimuat ulang.</p>
    <button id="toggle" type="button">🌙 Dark Mode</button>
  </main>

  <script>
    const tombol = document.getElementById("toggle");

    // Ubah tampilan sesuai tema, lalu simpan pilihan
    function terapkanTema(gelap) {
      document.body.classList.toggle("dark", gelap);
      tombol.textContent = gelap ? "☀️ Light Mode" : "🌙 Dark Mode";
      try {
        localStorage.setItem("tema", gelap ? "dark" : "light");
      } catch (e) {
        // localStorage tidak tersedia: toggle tetap jalan selama sesi
      }
    }

    // Baca preferensi tersimpan saat halaman dibuka
    let tersimpan = null;
    try {
      tersimpan = localStorage.getItem("tema");
    } catch (e) {}
    terapkanTema(tersimpan === "dark");

    // Toggle saat tombol diklik
    tombol.addEventListener("click", () => {
      terapkanTema(!document.body.classList.contains("dark"));
    });
  </script>
</body>
</html>
